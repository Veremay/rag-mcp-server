# LLM Configuration
llm:
  provider: azure           # azure | openai | ollama | deepseek
  model: gpt-4o
  azure_endpoint: "${AZURE_ENDPOINT}"
  api_key: "${AZURE_API_KEY}"
  base_url: null

# Embedding Configuration
embedding:
  provider: openai          # openai | ollama | local
  model: text-embedding-3-small
  api_key: "${OPENAI_API_KEY}"

# Vision LLM Configuration (for image captioning)
vision_llm:
  provider: azure           # azure | dashscope (Qwen-VL)
  model: gpt-4o

# Vector Store Configuration
vector_store:
  backend: chroma           # chroma | qdrant | pinecone
  persist_path: ./data/db/chroma
  collection_name: knowledge_hub

# Ingestion Configuration
ingestion:
  splitter:
    provider: recursive       # recursive | semantic | fixed
    chunk_size: 1000
    chunk_overlap: 200

# Retrieval Configuration
retrieval:
  sparse_backend: bm25      # bm25 | elasticsearch
  fusion_algorithm: rrf     # rrf | weighted_sum
  top_k_dense: 20
  top_k_sparse: 20
  top_k_final: 10

# Rerank Configuration
rerank:
  backend: cross_encoder    # none | cross_encoder | llm
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_m: 30

# Evaluation Configuration
evaluation:
  backends: [ragas, custom]
  golden_test_set: ./tests/fixtures/golden_test_set.json

# Observability Configuration
observability:
  enabled: true
  log_file: ./logs/traces.jsonl
  dashboard_port: 8501
