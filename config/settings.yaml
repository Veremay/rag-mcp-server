# LLM Configuration
llm:
  # Options: azure | openai (supports compatible APIs) | ollama
  # Note: Use 'openai' provider with 'base_url' for compatible services (e.g., vLLM, Moonshot, etc.)
  provider: openai
  model: qwen-turbo # deepseek-v3.2
  # azure_endpoint: "${AZURE_ENDPOINT}"
  api_key: "${ALIYUN_API_KEY}"
  base_url: "${ALIYUN_BASE_URL}"

# Embedding Configuration
embedding:
  # Options: openai (supports compatible APIs) | ollama | local
  provider: openai
  model: text-embedding-v4
  base_url: "${ALIYUN_BASE_URL}"
  api_key: "${ALIYUN_API_KEY}"

# Vision LLM Configuration (for image captioning)
vision_llm:
  # Options: azure | openai | ollama
  provider: openai
  model: qwen3-vl-flash
  base_url: "${ALIYUN_BASE_URL}"
  api_key: "${ALIYUN_API_KEY}"

# Vector Store Configuration
vector_store:
  # Options: chroma | qdrant | pinecone
  backend: chroma
  persist_path: ./data/db/chroma
  collection_name: knowledge_hub

# Ingestion Configuration
ingestion:
  loader:
    min_image_width: 200 # 最小图片宽度 (px)
    min_image_height: 200 # 最小图片高度 (px)
    min_image_size_kb: 5 # 最小图片文件大小 (KB)

  splitter:
    # Options: recursive | semantic | fixed
    provider: recursive
    chunk_size: 1000
    chunk_overlap: 200

  transform:
    chunk_refiner: # 文本优化
      enabled: true
      enable_llm: true
      prompt_path: "config/prompts/chunk_refinement.txt"
    metadata_enricher: # 会对每个分片调用一次 LLM，数据量大时成本极高且速度慢，如果开启，建议修改代码使其支持使用轻量级模型
      enabled: true
      enable_llm: true
      max_tags: 5
    image_captioner: # 同样是高耗时操作
      enabled: true
      prompt_path: "config/prompts/image_captioning.txt"

# Retrieval Configuration
retrieval:
  # Options: bm25 | elasticsearch
  sparse_backend: bm25
  # Options: rrf | weighted_sum
  fusion_algorithm: rrf
  top_k_dense: 20
  top_k_sparse: 20
  top_k_final: 10

# Rerank Configuration
rerank:
  # Options: none | cross_encoder | llm
  backend: cross_encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_m: 30

# Evaluation Configuration
evaluation:
  backends: [custom]
  golden_test_set: ./tests/fixtures/golden_test_set.json

# Observability Configuration
observability:
  enabled: true
  log_file: ./logs/traces.jsonl
  dashboard_port: 8501
